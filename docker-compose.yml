services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcpartlister}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcpartlister}
      POSTGRES_DB: ${POSTGRES_DB:-pcpartlister}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: lets `npm run db:studio` and a host-side dev server
      # reach the database, without exposing Postgres to the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pcpartlister} -d ${POSTGRES_DB:-pcpartlister}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pcpartlister}:${POSTGRES_PASSWORD:-pcpartlister}@db:5432/${POSTGRES_DB:-pcpartlister}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-32chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pcpartlister.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      PORT: 3000
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - images:/app/data/images
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  images:
